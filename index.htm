<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библейское Поле Чудес</title>
    <style>
        /* --- ОБЩИЕ СТИЛИ: Пастельный, дерево, древность --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5efe6; /* пастельный бежевый фон */
            background-image: radial-gradient(circle at 10% 20%, #fdf8f0 0%, #e8dccc 90%);
            padding: 20px;
        }

        /* Главный контейнер — как древний свиток/доска */
        .container {
            max-width: 800px;
            width: 100%;
            background: #fcf7ef;
            background-image: linear-gradient(145deg, #fcf7ef 0%, #f3eadc 100%);
            border: 12px solid #b8956a;
            border-image: repeating-linear-gradient(45deg, #b8956a, #dbb58b 15px, #a77b4f 20px) 30;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 30px rgba(180, 130, 70, 0.3);
            padding: 30px 25px;
            border-radius: 30px 30px 20px 20px;
            position: relative;
            transition: all 0.3s;
        }

        /* Декоративные уголки как на древних манускриптах */
        .container::before,
        .container::after {
            content: "✠";
            position: absolute;
            font-size: 32px;
            color: #b8956a;
            opacity: 0.3;
        }
        .container::before { top: 5px; left: 20px; }
        .container::after { bottom: 5px; right: 20px; }

        h1, h2 {
            text-align: center;
            color: #4d3e2b;
            text-shadow: 2px 2px 0 #dcc9b0;
            letter-spacing: 2px;
            font-weight: normal;
        }

        h1 {
            font-size: 2.6rem;
            border-bottom: 3px double #b8956a;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.8rem;
            margin: 15px 0;
        }

        /* ---- КНОПКИ (в стиле деревянных) ---- */
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #dbb58b;
            background: linear-gradient(145deg, #e4c4a0, #c79d72);
            border: 3px solid #8b6b44;
            border-radius: 60px;
            color: #2d241a;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 1px 1px 0 #efdfc0;
            box-shadow: 0 6px 0 #7a5d3c, 0 8px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.08s ease;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5d3c, 0 5px 12px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a5d3c;
            pointer-events: none;
        }

        .btn-secondary {
            background: #c7b29b;
            background: linear-gradient(145deg, #dac9b6, #b8a18a);
            border-color: #7a6854;
            box-shadow: 0 6px 0 #5f4f3e;
        }

        /* ---- БАННЕР С КАРТИНКОЙ ---- */
        .banner {
            margin: 25px 0 10px;
            border: 6px solid #b8956a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(100, 70, 30, 0.4), 0 10px 20px rgba(0,0,0,0.2);
            background: #dac9b6;
            line-height: 0;
        }
        .banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ---- ЭКРАНЫ (показываем по одному) ---- */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ---- ЭКРАН НАСТРОЕК (выбор команд) ---- */
        .team-options {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        .team-options label {
            font-size: 1.5rem;
            background: #ede0d0;
            padding: 12px 25px;
            border-radius: 50px;
            border: 2px solid #b8956a;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .team-options label:hover {
            background: #e2d0b8;
        }
        .team-options input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.3);
            accent-color: #8b6b44;
        }

        .team-inputs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 30px;
            margin: 20px 0;
        }
        .team-inputs div {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            background: rgba(255, 247, 235, 0.7);
            padding: 5px 15px 5px 10px;
            border-radius: 40px;
            border: 1px solid #c9b094;
        }
        .team-inputs input {
            padding: 8px 12px;
            border: 2px solid #b8956a;
            border-radius: 40px;
            background: #fffcf5;
            font-size: 1rem;
            width: 130px;
            outline: none;
        }
        .team-inputs input:focus {
            border-color: #7a5d3c;
            box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.3);
        }

        /* ---- ЖРЕБИЙ ---- */
        .lottery-box {
            text-align: center;
            padding: 25px 0;
        }
        .lottery-box .dice {
            font-size: 4.5rem;
            display: block;
            margin: 10px 0;
            animation: none;
        }
        .lottery-box .dice.spin {
            animation: shake 0.4s infinite alternate;
        }
        @keyframes shake {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.2); }
        }

        /* ---- ИГРОВОЙ СТОЛ (выбор сектора) ---- */
        .sector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 25px 0;
        }
        .sector-card {
            background: #f3eadc;
            border: 4px solid #b8956a;
            border-radius: 30px;
            padding: 20px 12px;
            text-align: center;
            box-shadow: inset 0 -8px 0 #9a7a54, 0 8px 15px rgba(0,0,0,0.1);
            transition: 0.15s;
            cursor: pointer;
        }
        .sector-card:hover {
            transform: scale(1.02);
            background: #f7efe2;
        }
        .sector-card:active {
            transform: translateY(4px);
            box-shadow: inset 0 -4px 0 #9a7a54;
        }
        .sector-card .icon {
            font-size: 2.8rem;
            display: block;
        }
        .sector-card .name {
            font-size: 1.6rem;
            font-weight: bold;
            color: #3d2e1b;
            margin: 5px 0;
        }
        .sector-card .difficulty {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }
        .sector-card .difficulty span {
            background: #dcc9b0;
            padding: 6px 20px;
            border-radius: 40px;
            border: 2px solid #8b6b44;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.1s;
            cursor: pointer;
        }
        .sector-card .difficulty span:hover {
            background: #c7ab8a;
        }
        .sector-card .difficulty span.selected {
            background: #b8956a;
            color: #fff;
            border-color: #5a432b;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .info-line {
            display: flex;
            justify-content: space-between;
            background: rgba(220, 201, 176, 0.4);
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid #b8956a;
            margin: 10px 0;
            font-size: 1.1rem;
            flex-wrap: wrap;
        }
        .info-line .team-name {
            font-weight: bold;
            color: #4d2f16;
        }

        .center {
            text-align: center;
        }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }

        /* Адаптив */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .sector-grid { grid-template-columns: 1fr; }
            .team-options { flex-direction: column; align-items: center; }
            .team-inputs { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- ===== ЭКРАН 1: ГЛАВНЫЙ ===== -->
    <div id="screen-main" class="screen active">
        <h1>📜 Поле Чудес</h1>
        <h2 style="font-size:1.8rem; margin-top:-10px;">Библейское</h2>
        <div class="center">
            <button class="btn" id="btnStart">✨ Начать игру</button>
        </div>
        <!-- Баннер с картинкой (поменяй image.jpg на своё) -->
        <div class="banner">
            <!-- СЮДА ВСТАВИШЬ СВОЮ КАРТИНКУ -->
            <img src="image.jpg" alt="Иисус" onerror="this.alt='Иисус Христос'; this.style.background='#dac9b6'; this.style.padding='40px 0'; this.style.textAlign='center'; this.style.fontSize='2rem';">
        </div>
        <p style="text-align:center; color:#6b5a47; margin-top:10px; font-style:italic;">«И познаете истину, и истина сделает вас свободными»</p>
    </div>

    <!-- ===== ЭКРАН 2: НАСТРОЙКИ (команды) ===== -->
    <div id="screen-settings" class="screen">
        <h2>⚔️ Выбор команд</h2>
        <div class="team-options">
            <label><input type="radio" name="teamCount" value="2" checked> 2 команды</label>
            <label><input type="radio" name="teamCount" value="3"> 3 команды</label>
        </div>
        <div class="team-inputs" id="teamInputs"></div>
        <div class="center">
            <button class="btn" id="btnLottery">🎲 Бросить жребий</button>
        </div>
    </div>

    <!-- ===== ЭКРАН 3: ЖРЕБИЙ ===== -->
    <div id="screen-lottery" class="screen">
        <h2>🎲 Жребий</h2>
        <div class="lottery-box">
            <span class="dice" id="diceIcon">⚖️</span>
            <p style="font-size:1.8rem;" id="lotteryResult">...</p>
            <button class="btn" id="btnLotteryConfirm">✅ Начать игру</button>
        </div>
    </div>

    <!-- ===== ЭКРАН 4: ИГРА (выбор сектора) ===== -->
    <div id="screen-game" class="screen">
        <div class="info-line">
            <span>👑 Ход: <span id="currentTeamDisplay" class="team-name">—</span></span>
            <span>🏆 Счёт: <span id="scoreDisplay">—</span></span>
        </div>
        <h2 style="font-size:1.4rem;">Выберите сектор и сложность</h2>
        <div class="sector-grid" id="sectorGrid">
            <!-- Сектора заполняются JS -->
        </div>
        <div class="center mt-20">
            <button class="btn btn-secondary" id="btnBackToSettings">↩ Настройки</button>
        </div>
        <p style="text-align:center; color:#6b5a47; margin-top:15px; font-size:0.9rem;">✝️ Выбор определит слово и стоимость очков</p>
    </div>

</div>

<script>
    // ================================================================
    //  БИБЛЕЙСКОЕ ПОЛЕ ЧУДЕС — ПОЛНАЯ ЛОГИКА
    // ================================================================

    // ---- ДАННЫЕ СЕКТОРОВ ----
    const SECTORS = [
        { id: 'pentateuch', icon: '📖', name: 'Пятикнижие', easy: 10, hard: 30 },
        { id: 'prophets',   icon: '🔥', name: 'Пророки',   easy: 15, hard: 40 },
        { id: 'gospel',     icon: '✝️', name: 'Евангелие', easy: 20, hard: 50 },
        { id: 'psalms',     icon: '🎵', name: 'Псалмы',    easy: 15, hard: 35 },
    ];

    // ---- СОСТОЯНИЕ ИГРЫ ----
    let state = {
        teams: [],              // [{ name: 'Команда 1', score: 0 }, ...]
        currentTeamIndex: 0,    // кто ходит
        isGameActive: false,
        // выбранный сектор и сложность будут храниться, но пока просто вывод
    };

    // ---- DOM-ссылки ----
    const $ = id => document.getElementById(id);
    const screenMain = $('screen-main');
    const screenSettings = $('screen-settings');
    const screenLottery = $('screen-lottery');
    const screenGame = $('screen-game');

    const btnStart = $('btnStart');
    const teamInputs = $('teamInputs');
    const btnLottery = $('btnLottery');
    const diceIcon = $('diceIcon');
    const lotteryResult = $('lotteryResult');
    const btnLotteryConfirm = $('btnLotteryConfirm');
    const currentTeamDisplay = $('currentTeamDisplay');
    const scoreDisplay = $('scoreDisplay');
    const sectorGrid = $('sectorGrid');
    const btnBackToSettings = $('btnBackToSettings');

    // ---- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    // Генерация полей ввода команд
    function renderTeamInputs() {
        const count = parseInt(document.querySelector('input[name="teamCount"]:checked').value);
        teamInputs.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const div = document.createElement('div');
            div.innerHTML = `
                <span>🏷️</span>
                <input type="text" id="teamName${i}" placeholder="Команда ${i}" value="Команда ${i}">
            `;
            teamInputs.appendChild(div);
        }
    }

    // Собрать данные команд из полей
    function getTeamsFromInputs() {
        const count = parseInt(document.querySelector('input[name="teamCount"]:checked').value);
        const teams = [];
        for (let i = 1; i <= count; i++) {
            const input = document.getElementById(`teamName${i}`);
            const name = input ? input.value.trim() || `Команда ${i}` : `Команда ${i}`;
            teams.push({ name, score: 0 });
        }
        return teams;
    }

    // Обновить отображение счёта и текущей команды
    function updateGameUI() {
        if (!state.teams.length) return;
        const team = state.teams[state.currentTeamIndex];
        currentTeamDisplay.textContent = team.name;
        const scores = state.teams.map(t => `${t.name}: ${t.score}⚡`).join(' | ');
        scoreDisplay.textContent = scores;
    }

    // Рендер секторов (игровой стол)
    function renderSectors() {
        sectorGrid.innerHTML = '';
        SECTORS.forEach(sector => {
            const card = document.createElement('div');
            card.className = 'sector-card';
            card.innerHTML = `
                <span class="icon">${sector.icon}</span>
                <div class="name">${sector.name}</div>
                <div class="difficulty">
                    <span data-sector="${sector.id}" data-diff="easy">🟢 Лёгкий (+${sector.easy})</span>
                    <span data-sector="${sector.id}" data-diff="hard">🔴 Сложный (+${sector.hard})</span>
                </div>
            `;
            sectorGrid.appendChild(card);
        });

        // Обработчики выбора сложности
        document.querySelectorAll('.difficulty span').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const sectorId = this.dataset.sector;
                const diff = this.dataset.diff;
                // убираем подсветку у всех в этой карточке
                const parent = this.closest('.sector-card');
                parent.querySelectorAll('.difficulty span').forEach(s => s.classList.remove('selected'));
                this.classList.add('selected');

                // Получаем очки за сектор
                const sector = SECTORS.find(s => s.id === sectorId);
                const points = diff === 'easy' ? sector.easy : sector.hard;
                const team = state.teams[state.currentTeamIndex];
                // Пока просто имитируем выбор (в будущем тут будет открытие слова)
                alert(`✅ Команда "${team.name}" выбрала ${sector.name} (${diff === 'easy' ? 'Лёгкий' : 'Сложный'}) и получает ${points} очков!`);
                team.score += points;
                updateGameUI();
                // Переход хода
                state.currentTeamIndex = (state.currentTeamIndex + 1) % state.teams.length;
                updateGameUI();
                // Снимаем подсветку
                parent.querySelectorAll('.difficulty span').forEach(s => s.classList.remove('selected'));
            });
        });
    }

    // ---- ЖЕРЕБЬЕВКА ----
    function runLottery() {
        const teams = getTeamsFromInputs();
        if (teams.length < 2) {
            alert('Выбери хотя бы 2 команды!');
            return;
        }
        state.teams = teams;
        // Анимация жребия
        showScreen('screen-lottery');
        diceIcon.textContent = '⚖️';
        diceIcon.className = 'dice spin';
        lotteryResult.textContent = 'Бросаем...';

        let count = 0;
        const interval = setInterval(() => {
            const randomIdx = Math.floor(Math.random() * teams.length);
            lotteryResult.textContent = `⏳ ${teams[randomIdx].name}...`;
            count++;
            if (count > 12) {
                clearInterval(interval);
                diceIcon.className = 'dice';
                const winnerIdx = Math.floor(Math.random() * teams.length);
                state.currentTeamIndex = winnerIdx;
                lotteryResult.textContent = `🏆 Первой ходит: ${teams[winnerIdx].name}!`;
                diceIcon.textContent = '🎯';
                btnLotteryConfirm.style.display = 'inline-block';
            }
        }, 200);
        btnLotteryConfirm.style.display = 'none';
    }

    // ---- ЗАГРУЗКА ИГРЫ (после жребия) ----
    function startGameAfterLottery() {
        showScreen('screen-game');
        renderSectors();
        updateGameUI();
        // Сохраняем команды в state (уже сохранены)
    }

    // ---- ОБРАБОТЧИКИ СОБЫТИЙ ----

    // 1. Кнопка "Начать игру" -> настройки
    btnStart.addEventListener('click', () => {
        showScreen('screen-settings');
        renderTeamInputs();
    });

    // 2. Переключение количества команд
    document.querySelectorAll('input[name="teamCount"]').forEach(radio => {
        radio.addEventListener('change', renderTeamInputs);
    });

    // 3. Жребий
    btnLottery.addEventListener('click', runLottery);

    // 4. Подтвердить жребий -> игра
    btnLotteryConfirm.addEventListener('click', startGameAfterLottery);

    // 5. Назад к настройкам из игры
    btnBackToSettings.addEventListener('click', () => {
        showScreen('screen-settings');
        renderTeamInputs();
    });

    // ---- ИНИЦИАЛИЗАЦИЯ ----
    renderTeamInputs();
    showScreen('screen-main');
    // Для теста показываем, что баннер работает (если нет картинки - будет текст)
</script>

</body>
  </html>
